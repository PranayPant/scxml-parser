name: CI

# Runs formatting, linting, type-checking, tests, and the 100% coverage gate
# on the PR flow (and on pushes to main) so that the same quality gates
# enforced locally by lefthook (pre-commit Biome format/lint and pre-push
# `biome check src tests` + `tsc --noEmit`) run in CI before a pull request
# merges. CI uses the package.json scripts directly rather than lefthook.
#
# Coverage thresholds (lines/functions/statements at 100%, branches at 99%)
# are defined in vitest.config.ts and enforced here via `npm run test:coverage`.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm ci` runs the `prepare` script (`npm run build`), so the build must
      # succeed before any quality gate runs.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Coverage (thresholds from vitest.config.ts)
        run: npm run test:coverage
